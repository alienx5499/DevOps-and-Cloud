apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notes-chart.fullname" . }}-config
  labels:
    {{- include "notes-chart.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.app.environment | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>SST Notes App - {{ .Values.app.environment | title }}</title></head>
    <body style="font-family: sans-serif; padding: 40px; background-color: #f4f6f8;">
      <h1>SST Notes Application</h1>
      <p>Environment: <strong>{{ .Values.app.environment }}</strong></p>
      <p>Release Revision: <strong>{{ .Release.Revision }}</strong></p>
      <p>Version: <strong>{{ .Chart.AppVersion }}</strong></p>
    </body>
    </html>
