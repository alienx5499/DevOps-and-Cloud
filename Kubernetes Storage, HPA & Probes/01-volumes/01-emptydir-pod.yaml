apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo-pod
  labels:
    app: storage-demo
    storage-type: emptydir
spec:
  containers:
    - name: writer-container
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          while true; do
            echo "$(date '+%Y-%m-%d %H:%M:%S') - Writer container health beat" >> /shared-data/status.log;
            sleep 5;
          done
      volumeMounts:
        - name: scratch-volume
          mountPath: /shared-data

    - name: reader-container
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "Reader started. Monitoring shared volume...";
          tail -f /shared-data/status.log;
      volumeMounts:
        - name: scratch-volume
          mountPath: /shared-data
          readOnly: true

  volumes:
    - name: scratch-volume
      emptyDir:
        sizeLimit: 100Mi
