apiVersion: v1
kind: Pod
metadata:
  name: persistent-storage-pod
  labels:
    app: persistent-demo
spec:
  containers:
    - name: data-app
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
          name: http
      volumeMounts:
        - name: persistent-storage
          mountPath: /usr/share/nginx/html
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: static-data-pvc
