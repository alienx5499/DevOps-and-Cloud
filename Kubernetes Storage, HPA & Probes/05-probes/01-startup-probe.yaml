apiVersion: v1
kind: Pod
metadata:
  name: startup-probe-pod
  labels:
    app: probe-demo
    probe-type: startup
spec:
  containers:
    - name: slow-init-app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "Simulating 20-second startup initialization...";
          sleep 20;
          touch /tmp/started;
          echo "Application started. Serving requests...";
          while true; do sleep 5; done
      startupProbe:
        exec:
          command:
            - cat
            - /tmp/started
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 10
        timeoutSeconds: 2
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/started
        periodSeconds: 10
        failureThreshold: 3
