apiVersion: v1
kind: Pod
metadata:
  name: readiness-probe-pod
  labels:
    app: probe-demo
    probe-type: readiness
spec:
  containers:
    - name: web-service
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
          name: http
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 3
        timeoutSeconds: 2
