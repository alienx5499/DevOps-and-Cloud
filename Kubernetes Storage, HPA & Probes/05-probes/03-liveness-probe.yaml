apiVersion: v1
kind: Pod
metadata:
  name: liveness-probe-pod
  labels:
    app: probe-demo
    probe-type: liveness
spec:
  containers:
    - name: resilient-app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          touch /tmp/healthy;
          echo "Container started as healthy. Will simulate failure after 25s...";
          sleep 25;
          rm -rf /tmp/healthy;
          echo "Simulated deadlock or failure! File removed.";
          while true; do sleep 5; done
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/healthy
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2
        timeoutSeconds: 2
