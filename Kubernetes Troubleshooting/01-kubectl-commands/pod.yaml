apiVersion: v1
kind: Pod
metadata:
  name: demo-inspect-pod
  labels:
    app: demo-app
    tier: frontend
    env: staging
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
