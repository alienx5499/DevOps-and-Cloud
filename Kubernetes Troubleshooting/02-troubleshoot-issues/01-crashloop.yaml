apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
  labels:
    issue: crashloopbackoff
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "Starting application runtime..."
          echo "FATAL: Database connection timeout on tcp://db-internal:5432"
          exit 1
---
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-fixed
  labels:
    issue: crashloopbackoff-fixed
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "Starting application runtime..."
          echo "Database connection established. Serving traffic."
          sleep 3600
