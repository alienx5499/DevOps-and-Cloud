apiVersion: v1
kind: Pod
metadata:
  name: pending-demo
  labels:
    issue: pending
spec:
  nodeSelector:
    disktype: non-existent-hardware-nvme
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "500" # Exceeds total cluster capacity
          memory: "500Gi"
---
apiVersion: v1
kind: Pod
metadata:
  name: pending-fixed
  labels:
    issue: pending-fixed
spec:
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
