apiVersion: v1
kind: Pod
metadata:
  name: containercreating-demo
  labels:
    issue: containercreating
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      envFrom:
        - configMapRef:
            name: non-existent-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-runtime-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Pod
metadata:
  name: containercreating-fixed
  labels:
    issue: containercreating-fixed
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      envFrom:
        - configMapRef:
            name: app-runtime-config
