apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  labels:
    app: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
# Broken Service: Selector has a typo (app: backend-apii)
apiVersion: v1
kind: Service
metadata:
  name: backend-service-broken
spec:
  type: ClusterIP
  selector:
    app: backend-apii # Typo: Does not match deployment label
  ports:
    - port: 80
      targetPort: 80
---
# Fixed Service: Correct selector matching backend-api
apiVersion: v1
kind: Service
metadata:
  name: backend-service-fixed
spec:
  type: ClusterIP
  selector:
    app: backend-api
  ports:
    - port: 80
      targetPort: 80
---
# DNS test client pod
apiVersion: v1
kind: Pod
metadata:
  name: dns-client-pod
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
